name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

jobs:
  cla:
    runs-on: ubuntu-latest
    # Job level, not step level: a step's own `env:` is not available in that
    # step's `if:`, which is why the first attempt at this guard still ran the
    # action and still failed.
    env:
      SIGNATURES_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
    steps:
      # The bot stores signatures on a branch, which needs a PAT with repo
      # scope. Until CLA_SIGNATURES_TOKEN exists the job skips rather than
      # fails: a permanently red check on every pull request is noise, and noise
      # is how real failures get missed.
      #
      # To enable: Settings -> Secrets and variables -> Actions -> New
      # repository secret, named CLA_SIGNATURES_TOKEN, holding a PAT with repo
      # scope.
      - name: Check the contributor licence agreement
        if: >-
          env.SIGNATURES_TOKEN != '' &&
          ((github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
           github.event_name == 'pull_request_target')
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-document: https://github.com/yocopk/keyblade/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: yocopk,dependabot[bot]

      - name: Report that the CLA check is not configured
        if: env.SIGNATURES_TOKEN == ''
        run: |
          echo "::notice::CLA check skipped: CLA_SIGNATURES_TOKEN is not set."
          echo "Contributions still require agreeing to CLA.md; the automated"
          echo "check is simply not wired up yet. See the comment in this file."
