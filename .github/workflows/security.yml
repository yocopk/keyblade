name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories appear after code is written, so this has to run on a clock and
    # not only when something changes.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  advisories:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # cargo-deny rather than cargo-audit, because it honours the target list
      # in deny.toml. cargo-audit scans Cargo.lock whole, which on this project
      # means reporting unmaintained GTK3 bindings that a Windows build never
      # compiles. Findings nobody can act on are worse than no findings: they
      # teach everyone to skip the job.
      - name: Advisories for the shipped target
        run: cargo deny check advisories

  fuzz:
    name: Fuzz the untrusted parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # A short run on every change. It will not find deep bugs, but it does
      # catch a regression that makes a malformed blob panic.
      - name: Fuzz the header parser
        working-directory: crates/keyblade-core
        run: cargo fuzz run --target x86_64-unknown-linux-gnu header-parse -- -max_total_time=60

      - name: Fuzz the decryption path
        working-directory: crates/keyblade-core
        run: cargo fuzz run --target x86_64-unknown-linux-gnu decrypt-blob -- -max_total_time=60

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: crates/keyblade-core/fuzz/artifacts/
