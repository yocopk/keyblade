[package]
name = "keyblade"
description = "An offline, encrypted vault for passwords, documents, images and video"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# The _lib suffix keeps the library name distinct from the binary, which
# otherwise collide on Windows. See rust-lang/cargo#8519.
name = "keyblade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No plugins. tauri-plugin-opener ships in the default template and is removed
# deliberately: it hands the web layer the ability to open arbitrary URLs and
# files through the OS, which is precisely the capability a vault that claims to
# never touch the network must not have.
#
# protocol-asset is the one feature enabled, and only so the background music can
# be streamed from a file beside the application instead of being embedded in the
# binary. It is narrowed twice over: the assetProtocol scope in tauri.conf.json
# and the capability in capabilities/default.json both restrict it to
# $RESOURCE/music/*, so it reads that directory and nothing else.
tauri = { version = "2", features = ["protocol-asset"] }

keyblade-core = { workspace = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
